# Lychee configuration for CodeEditorLand documentation

# Files to check for links
extensions = [
	".md",
	".rs",   # Rust source files
	".ts",   # TypeScript source files
	".tsx",  # TypeScript JSX files
	".js",   # JavaScript files
	".json", # JSON files (may contain URLs)
]

# Exclude certain patterns
exclude = [
	# Local development links
	"http://localhost:*",
	"http://127.0.0.1:*",

	# Email links
	"mailto:*",

	# Internal rust-doc links
	"rust/doc/",
	"Documentation/Rust/",
	"Element/*/Documentation/Rust/",

	# Effect module (third-party dependency)
	"Documentation/Module/effect/",
	"effect-ts.github.io",

	# VS Code internal links
	"vscode-workbench",
	"workbench/contrib/chat",

	# Build artifacts
	"/debug/build/",
	"/target/debug/build/",

	# Placeholder/example links
	"example.com",
]

# Allow redirects
scheme = ["https", "http"]

# Request timeout in seconds
timeout = 30

# Max number of parallel network requests
max_concurrency = 10

# Exclude paths
exclude_path = [
	"node_modules",
	"target",
	"Rust/doc",
	"effect",
	".git",
	"Dependency",
	# Element/ subdirectories are submodule checkouts - local file links into
	# them are valid on disk but not on GitHub. They must be absolute GitHub
	# URLs pointing to each element's own repo. Exclude the raw paths here so
	# lychee does not try to resolve them as file:// URLs (they are already
	# converted to https:// URLs in the docs).
	"Element",
]

# Accepted status codes
accept = [200, 204, 301, 302, 307, 308, 429]

# Retry failed requests
max_retries = 3

# Output format
format = "compact"
