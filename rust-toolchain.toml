[toolchain]
channel = "nightly"
components = [
	"rustfmt",
	"clippy",
	"rust-src",
	"rust-analyzer",
	"miri",
	"llvm-tools",
	"rust-docs",
]
targets = [
	"aarch64-apple-darwin",
	"aarch64-apple-ios",
	"aarch64-apple-ios-sim",
	"aarch64-linux-android",
	"armv7-linux-androideabi",
	"i686-linux-android",
	"wasm32-unknown-unknown",
	"x86_64-apple-ios",
	"x86_64-linux-android",
]
