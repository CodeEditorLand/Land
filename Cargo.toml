[workspace.metadata]

[workspace.package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
categories = []
documentation = "https://Documentation.Editor.Land"
edition = "2024"
homepage = "https://Editor.Land/"
license-file = "LICENSE"
publish = false
readme = "README.md"
repository = "https://github.com/CodeEditorLand/Land"
rust-version = "1.89.0"
