config = { version = "0.15.19" }
crossbeam-deque = { version = "0.8.6" }
dashmap = { version = "6.1.0" }
dirs = { version = "6.0.0" }
Echo = { path = "Element/Echo" }
env_logger = { version = "0.11.8" }
flate2 = { version = "1.1.8" }
