[workspace.metadata]

[workspace.package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
categories = []
documentation = "https://Documentation.Editor.Land"
edition = "2024"
homepage = "https://Editor.Land/"
license-file = "LICENSE"
publish = false
readme = "README.md"
repository = "https://github.com/CodeEditorLand/Land"
rust-version = "1.95.0"

[workspace.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
# Performance + size - these compose well; documented effects below.
opt-level = 3
# `lto = true` is `fat`-LTO (single LLVM linker stage). Combined with
# `codegen-units = 1` rustc optimises across crate boundaries, often
# inlining hot tonic / Effect / mmap paths that would otherwise stay
# behind a function-call boundary. Compile time ~3× longer; runtime
# ~10-15 % faster on the IPC hot path; binary ~5-10 % smaller.
lto = true
codegen-units = 1
strip = true
# `panic = "abort"` removes the unwind machinery (~3-5 MB on the
# Mountain binary). The Tauri runtime already handles panics at the
# runtime boundary and Mountain's policy on a real panic is exit-and-
# restart anyway (Cocoon respawns; Wind reconnects). The wins:
#   - Smaller binary (no unwind tables, no landing pads).
#   - Faster builds (~10 % off LTO step - no unwind metadata to track).
#   - Smaller stack frames (no implicit unwind-cleanup state).
# The cost: `std::panic::catch_unwind` becomes a no-op (panics abort
# the process). Mountain has zero `catch_unwind` call sites today, so
# this is purely upside.
panic = "abort"
# Explicit defaults (matches Cargo's release defaults; documented for
# transparency to anyone reading this profile).
overflow-checks = false
debug = false
incremental = false

# Build scripts (`build.rs`, `*-build` crates like `prost-build`,
# `tonic-prost-build`, `phf_codegen`) only run at compile time; they
# emit code that the main pipeline consumes. Optimising them at
# `opt-level = 3` is wasted work - they run once per build. Drop to
# `opt-level = 0` so build-script compilation is fast. Saves ~30-60 s
# off the first cold release build; subsequent incremental builds
# already cache. Unaffected: the actual codegen output (which IS
# compiled at the main `[profile.release]` opt-level).
[profile.release.build-override]
opt-level = 0
codegen-units = 256
debug = false

# Same logic for the dev profile - build scripts at opt-level 0
# are negligibly slower at runtime but compile much faster.
[profile.dev.build-override]
opt-level = 0
codegen-units = 256
debug = false

[profile.dev]
opt-level = 0
debug = true

[profile.test]
inherits = "dev"
opt-level = 0

[profile.bench]
inherits = "release"
debug = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true

# =============================================================================
# Tauri ecosystem - vendored under Dependency/Tauri/Dependency/
# =============================================================================
# Every crate Land's transitive dependency graph asks for from crates.io
# under the tauri-apps namespace gets redirected here to the local
# vendored copy. Land patches local; once a patch is upstream-ready it
# moves to a fork branch on the vendored repo and a PR upstream.
#
# Ordering: alphabetical within each group; groups follow the layout of
# Dependency/Tauri/Dependency/.
# =============================================================================

