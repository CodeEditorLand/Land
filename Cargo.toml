[workspace.metadata]

[workspace.package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
categories = []
documentation = "https://Documentation.Editor.Land"
edition = "2024"
homepage = "https://Editor.Land/"
license-file = "LICENSE"
publish = false
readme = "README.md"
repository = "https://github.com/CodeEditorLand/Land"
rust-version = "1.95.0"

[workspace.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[profile.test]
inherits = "dev"
opt-level = 0

[profile.bench]
inherits = "release"
debug = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
