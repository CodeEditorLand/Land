packages:
    - "Dependency/Biome/NPM/**"
    - "Dependency/Microsoft/NPM/**"
    - "Dependency/OXC/NPM/**"
    - "Dependency/Rolldown/NPM/**"
    - "Dependency/SWC/NPM/**"
    - "Dependency/Tauri/NPM/**"
    - "Dependency/Vercel/NPM/**"

    - "Element/**"

    - "!**/Target/**"

preferWorkspacePackages: true

linkWorkspacePackages: deep

onlyBuiltDependencies:
    - "@biomejs/biome"
    - "@parcel/watcher"
    - "@swc/core"
    - esbuild
    - msgpackr-extract
    - protobufjs
    - sharp
    - workerd

minimumReleaseAge: 0

allowBuilds:
    "@biomejs/biome": true
    "@parcel/watcher": true
    "@swc/core": true
    esbuild: true
    msgpackr-extract: true
    protobufjs: true
    sharp: true
    workerd: true

nodeLinker: hoisted
