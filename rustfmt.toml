array_width = 80
attr_fn_like_width = 80
binop_separator = "Front"
blank_lines_lower_bound = 0
blank_lines_upper_bound = 1
brace_style = "PreferSameLine"
chain_width = 80
color = "Always"
combine_control_expr = true
comment_width = 80
condense_wildcard_suffixes = true
control_brace_style = "AlwaysSameLine"
edition = "2024"
empty_item_single_line = true
enum_discrim_align_threshold = 0
fn_call_width = 80
fn_params_layout = "Tall"
fn_single_line = true
force_explicit_abi = false
force_multiline_blocks = true
format_code_in_doc_comments = true
format_generated_files = true
format_macro_bodies = true
format_macro_matchers = true
format_strings = true
group_imports = "StdExternalCrate"
hard_tabs = true
hex_literal_case = "Upper"
imports_granularity = "Crate"
imports_indent = "Block"
imports_layout = "HorizontalVertical"
indent_style = "Block"
inline_attribute_width = 0
match_arm_blocks = true
match_arm_leading_pipes = "Never"
match_block_trailing_comma = true
max_width = 120
merge_derives = true
newline_style = "Unix"
normalize_comments = true
normalize_doc_attributes = true
overflow_delimited_expr = false
remove_nested_parens = false
reorder_impl_items = false
reorder_imports = false
reorder_modules = false
single_line_if_else_max_width = 80
skip_children = false
space_after_colon = false
spaces_around_ranges = false
struct_field_align_threshold = 0
struct_lit_single_line = true
struct_lit_width = 80
struct_variant_width = 80
tab_spaces = 4
trailing_comma = "Vertical"
trailing_semicolon = true
type_punctuation_density = "Wide"
unstable_features = true
use_field_init_shorthand = true
use_small_heuristics = "Max"
use_try_shorthand = true
where_single_line = false
wrap_comments = true
style_edition = "2024"

# Paths relative to workspace root to exclude from rustfmt.
#
# Mirrored across the same canonical exclusion set used by:
#   Maintain/Format.sh           (shfmt find paths)
#   .vscode/settings.json        (files.exclude / search.exclude /
#                                 files.watcherExclude / formatFiles.*)
#   .prettierignore              (workspace + Land scope)
#
# Categories:
# - Documentation/Rust/{doc,debug,release} - rustdoc + cargo-doc trees.
#   The `debug/build/<crate>-<hash>/out/` paths can contain synthesised
#   `.rs` from build scripts; rustfmt mangles them.
# - Generated/ dirs - prost-build / tonic-build output. rustfmt corrupts
#   `: ::` qualifiers in prost macros, producing invalid `:::` tokens.
# - Target/ - cargo build output.
# - Dependency/ - vendored upstream code, never reformat.
ignore = [
	# Vendored
	"Dependency/",

	# Cargo build output (workspace + per-Element + per-Documentation)
	"Target/",
	"target/",
	"**/Target/",
	"**/target/",
	"**/.fingerprint/",
	"**/incremental/",
	"**/deps/",
	"**/tauri-codegen-assets/",

	# Rustdoc + cargo-doc trees (per-Element variants too)
	"Documentation/",
	"**/Documentation/Rust/doc/",
	"**/Documentation/Rust/debug/",
	"**/Documentation/Rust/release/",

	# Project-internal codegen output. tonic-build / prost-build
	# emits these under each crate that wires the build.rs.
	"Element/Mountain/Source/Vine/Generated",
	"Element/Mountain/Source/IPC/Generated",
	"Element/Air/Source/Vine/Generated",
	"Element/Grove/Source/Protocol/Generated",
	"Element/Cocoon/Source/Generated",
	"Element/Wind/Source/Effect/Generated",
	"**/Generated/",
	"**/.generated/",
	"**/gen/",

	# SideCar's vendored Node distribution per platform/version.
	"**/SideCar/*/NODE/",
]
